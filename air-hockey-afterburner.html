<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AIR HOCKEY AFTERBURNER — Autonomy Labs</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05060f;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
  #scene{position:fixed;inset:0;display:block;touch-action:none;cursor:crosshair;}
  #hud{position:fixed;top:0;left:0;right:0;padding:10px 14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5;color:#cfe8ff;text-shadow:0 0 8px rgba(0,180,255,.6);}
  .hud-block{display:flex;flex-direction:column;gap:2px;}
  .hud-label{font-size:10px;letter-spacing:2px;color:#7fb8e8;text-transform:uppercase;}
  .hud-value{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;}
  #hud .mid{display:flex;flex-direction:column;align-items:center;gap:4px;}
  #charge-wrap{width:150px;height:12px;border:1px solid #ffb300;border-radius:6px;overflow:hidden;background:rgba(0,0,0,.5);}
  #charge-fill{height:100%;width:0%;background:linear-gradient(90deg,#ffb300,#ff5e00);transition:width .15s;}
  #charge-label{font-size:9px;letter-spacing:2px;color:#ffb300;text-transform:uppercase;}
  #phase{font-size:11px;color:#ff3d81;font-weight:700;letter-spacing:1px;display:none;}
  #combo{position:fixed;left:50%;top:64px;transform:translateX(-50%);font-size:26px;font-weight:900;color:#ffd23e;text-shadow:0 0 12px rgba(255,210,62,.8);display:none;z-index:5;pointer-events:none;}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,6,16,.82);z-index:10;color:#e8f4ff;text-align:center;}
  #overlay h1{font-size:40px;margin:0 0 6px;letter-spacing:3px;background:linear-gradient(90deg,#00d4ff,#ff3d81,#ffb300);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;}
  #overlay h2{font-size:18px;margin:0 0 18px;color:#9fd4ff;font-weight:400;}
  #overlay .big{font-size:34px;font-weight:800;margin:6px 0;}
  #overlay .sub{font-size:14px;color:#7fb8e8;margin:2px 0;}
  #overlay .hint{margin-top:22px;font-size:13px;color:#5a7fa8;letter-spacing:1px;}
  #overlay button{margin-top:14px;padding:12px 34px;font-size:16px;font-weight:700;letter-spacing:2px;color:#04101a;background:linear-gradient(90deg,#00d4ff,#ffb300);border:none;border-radius:30px;cursor:pointer;pointer-events:auto;}
  #overlay button:active{transform:scale(.96);}
  #touch{position:fixed;bottom:0;left:0;right:0;height:40%;display:none;z-index:4;pointer-events:none;}
  #touch .zone{position:absolute;bottom:0;width:50%;height:100%;pointer-events:auto;}
  #touch .zone.left{left:0;}
  #touch .zone.right{right:0;}
  #touch .zone::after{content:'';position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:70px;height:70px;border-radius:50%;border:2px solid rgba(0,212,255,.35);}
  #touch .zone.right::after{border-color:rgba(255,61,129,.35);}
  #mute{position:fixed;top:10px;right:14px;z-index:6;background:rgba(0,0,0,.4);border:1px solid #2a4a6a;color:#9fd4ff;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;pointer-events:auto;}
  @media (pointer:coarse){ #touch{display:block;} }
</style>
</head>
<body>
<div id="scene"></div>
<div id="hud">
  <div class="hud-block">
    <span class="hud-label">You</span>
    <span class="hud-value" id="score">0</span>
  </div>
  <div class="mid">
    <div id="phase">PRESSURE!</div>
    <div id="charge-label">Rally Charge</div>
    <div id="charge-wrap"><div id="charge-fill"></div></div>
  </div>
  <div class="hud-block" style="align-items:flex-end;">
    <span class="hud-label">High Score</span>
    <span class="hud-value" id="high">0</span>

</div>
<div id="combo"></div>
<button id="mute">SOUND ON</button>
<div id="touch"><div class="zone left"></div><div class="zone right"></div></div>
<div id="overlay">
  <h1>AIR HOCKEY AFTERBURNER</h1>
  <h2>Defend, return, charge the rally — spend it on a burning shot</h2>
  <div class="big" id="final-score">0</div>
  <div class="sub" id="final-high">High score: 0</div>
  <div class="sub" id="final-new">NEW HIGH SCORE!</div>
  <div class="hint">MOUSE / ARROWS — move paddle &nbsp;·&nbsp; SPACE — Afterburner shot &nbsp;·&nbsp; R — restart</div>
  <button id="start">START</button>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }

<script type="module">
import * as THREE from 'three';

/* ============================================================
   AIR HOCKEY AFTERBURNER — original Three.js air-hockey score attack
   Self-contained single file. No external assets, no build.
   ============================================================ */

const TEST = new URLSearchParams(location.search).has('test');

// ---------- rink geometry (y up; player at bottom) ----------
const RW = 620, RH = 900;                 // rink half-width/height
const GOAL_W = 240, GOAL_DEPTH = 60;
const PUCK_R = 22, PADDLE_R = 46;
const PLAYER_Y = -RH + 90;
const OPP_Y = RH - 90;
const GRAV = 0;                            // air hockey: no gravity
const FRICTION = 0.997;
const MAX_SPEED = 1500;

// ---------- state ----------
let score = 0, high = 0, oppScore = 0, firstTo = 7;
let charge = 0, boostActive = false, boostT = 0;
let combo = 1, comboT = 0;
let state = 'title';                       // title | play | over
let phase = 'normal', phaseT = 0, phaseCd = 0;
let rally = 0, lastHitT = 0;
let puck = { x: 0, y: 0, vx: 0, vy: 0, r: PUCK_R, onTable: true };
let player = { x: 0, y: PLAYER_Y, r: PADDLE_R, vx: 0, vy: 0 };
let opp = { x: 0, y: OPP_Y, r: PADDLE_R, vx: 0, vy: 0, targetX: 0, targetY: 0, react: 0.35, skill: 0.5 };
let parts = [], popups = [], trails = [];
let shake = 0, flashT = 0, goalFlash = 0, serveT = 0;
let playerHitCd = 0, oppHitCd = 0;
let muted = false;
try { muted = localStorage.getItem('ah_mute') === '1'; } catch (e) {}
try { high = parseInt(localStorage.getItem('ah_high') || '0', 10) || 0; } catch (e) {}

// ---------- renderer ----------
const sceneEl = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.setSize(window.innerWidth, window.innerHeight);
sceneEl.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060f);
const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 1, 4000);
camera.position.set(0, 0, 1500);
camera.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0x334466, 1.4));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(300, 600, 900);
scene.add(key);
const rim = new THREE.PointLight(0x00d4ff, 900, 2000);
rim.position.set(0, 0, 500);
scene.add(rim);

// rink base
const base = new THREE.Mesh(
  new THREE.BoxGeometry(RW * 2 + 60, 30, RH * 2 + 60),
  new THREE.MeshStandardMaterial({ color: 0x0a0f22, roughness: 0.9, metalness: 0.2 })
);
base.position.y = -15;
scene.add(base);

// rink floor
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(RW * 2, RH * 2),
  new THREE.MeshStandardMaterial({ color: 0x0e1738, roughness: 0.4, metalness: 0.5 })
);
scene.add(floor);

// center line + circle
const centerLine = new THREE.Mesh(
  new THREE.PlaneGeometry(RW * 2, 6),
  new THREE.MeshStandardMaterial({ color: 0x2a4a7a, emissive: 0x2a4a7a, emissiveIntensity: 0.4, side: THREE.DoubleSide })
);
centerLine.position.z = 1;
scene.add(centerLine);
const centerRing = new THREE.Mesh(
  new THREE.RingGeometry(120, 150, 48),
  new THREE.MeshStandardMaterial({ color: 0x2a4a7a, emissive: 0x2a4a7a, emissiveIntensity: 0.4, side: THREE.DoubleSide })
);
centerRing.position.z = 1;
scene.add(centerRing);

// walls
function wall(w, h, x, y, color) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, 20),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.5 })
  );
  m.position.set(x, y, 0);
  scene.add(m);
  return m;
}
wall(RW * 2, 24, 0, RH, 0x00d4ff);        // top
wall(RW * 2, 24, 0, -RH, 0x00d4ff);      // bottom
wall(24, RH * 2, RW, 0, 0x00d4ff);       // right
wall(24, RH * 2, -RW, 0, 0x00d4ff);      // left

// goals (openings in top/bottom walls)
function goal(x, y, color) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(GOAL_W, 20, 30),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.9 })
  );
  m.position.set(x, y, 0);
  scene.add(m);
  const back = new THREE.Mesh(
    new THREE.BoxGeometry(GOAL_W, 30, 10),
    new THREE.MeshStandardMaterial({ color: 0x111a33, roughness: 0.6 })
  );
  back.position.set(x, y + (y > 0 ? GOAL_DEPTH : -GOAL_DEPTH), 0);
  scene.add(back);
  return m;
}
const goalTop = goal(0, RH + 10, 0xff3d81);    // opponent's goal (player scores here)
const goalBot = goal(0, -RH - 10, 0x00d4ff);  // player's goal (opponent scores here)

// goal posts
function post(x, y) {
  const m = new THREE.Mesh(
    new THREE.CylinderGeometry(10, 10, 40, 12),
    new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x88ccff, emissiveIntensity: 0.6 })
  );
  m.position.set(x, y, 0);
  scene.add(m);
  return m;
}
post(-GOAL_W / 2, RH); post(GOAL_W / 2, RH);
post(-GOAL_W / 2, -RH); post(GOAL_W / 2, -RH);

// bonus zones (top corners — shooting through them doubles next goal)
const bonusZones = [
  { x: -RW + 90, y: RH - 130, r: 55, active: false, t: 0 },
  { x: RW - 90, y: RH - 130, r: 55, active: false, t: 0 },
];
const bonusMeshes = bonusZones.map(z => {
  const m = new THREE.Mesh(
    new THREE.TorusGeometry(z.r, 6, 8, 32),
    new THREE.MeshStandardMaterial({ color: 0xffb300, emissive: 0xffb300, emissiveIntensity: 0.3 })
  );
  m.rotation.x = Math.PI / 2;
  m.position.set(z.x, z.y, 2);
  scene.add(m);
  return m;
});

// puck
const puckMesh = new THREE.Mesh(
  new THREE.CylinderGeometry(PUCK_R, PUCK_R, 14, 24),
  new THREE.MeshStandardMaterial({ color: 0xdfe8ff, emissive: 0x88ccff, emissiveIntensity: 0.4, roughness: 0.2, metalness: 0.8 })
);
scene.add(puckMesh);
const puckGlow = new THREE.Mesh(
  new THREE.CylinderGeometry(PUCK_R * 1.6, PUCK_R * 1.6, 4, 24),
  new THREE.MeshBasicMaterial({ color: 0x88ccff, transparent: true, opacity: 0.15 })
);
scene.add(puckGlow);

// paddles
function paddleMesh(color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(PADDLE_R, PADDLE_R, 20, 28),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.5, roughness: 0.3, metalness: 0.6 })
  );
  g.add(body);
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(PADDLE_R + 4, 4, 8, 32),
    new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: color, emissiveIntensity: 0.7 })
  );
  ring.rotation.x = Math.PI / 2;
  g.add(ring);
  scene.add(g);
  return g;
}
const playerMesh = paddleMesh(0x00d4ff);
const oppMesh = paddleMesh(0xff3d81);

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const scoreEl = $('score'), highEl = $('high'), chargeFill = $('charge-fill'),
  comboEl = $('combo'), overlay = $('overlay'), finalScore = $('final-score'),
  finalHigh = $('final-high'), finalNew = $('final-new'), startBtn = $('start'),
  muteBtn = $('mute'), phaseEl = $('phase');
function setMuteUI() { muteBtn.textContent = muted ? 'SOUND OFF' : 'SOUND ON'; }
muteBtn.addEventListener('click', () => { muted = !muted; try { localStorage.setItem('ah_mute', muted ? '1' : '0'); } catch (e) {} setMuteUI(); });
setMuteUI();

// ---------- audio ----------
let AC = null;
function audio() {
  if (muted) return null;
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, slide) {
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, ac.currentTime + dur);
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur + 0.02);
}
function noise(dur, vol) {
  const ac = audio(); if (!ac) return;
  const n = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = ac.createBufferSource(); src.buffer = buf;
  const g = ac.createGain(); g.gain.value = vol;
  src.connect(g); g.connect(ac.destination); src.start();
}
const sfx = {
  hit: () => tone(180, 0.08, 'triangle', 0.2, 120),
  wall: () => tone(300, 0.05, 'sine', 0.1, 200),
  goal: () => { tone(660, 0.15, 'sine', 0.25); setTimeout(() => tone(880, 0.2, 'sine', 0.25), 100); setTimeout(() => tone(1320, 0.3, 'sine', 0.2), 220); },
  oppGoal: () => tone(220, 0.4, 'sawtooth', 0.15, 110),
  boost: () => { tone(110, 0.4, 'sawtooth', 0.15, 330); noise(0.3, 0.1); },
  charge: () => tone(520, 0.1, 'sine', 0.12, 780),
  bonus: () => { tone(880, 0.1, 'sine', 0.2); setTimeout(() => tone(1175, 0.14, 'sine', 0.2), 80); },
  over: () => { tone(440, 0.2, 'sine', 0.15); setTimeout(() => tone(330, 0.25, 'sine', 0.15), 180); setTimeout(() => tone(220, 0.4, 'sine', 0.15), 360); },
};

// ---------- helpers ----------
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function addPopup(x, y, text, color) {
  popups.push({ x, y, text, color, t: 0, life: 0.9 });
}
function addParts(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 120 + Math.random() * 320;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.5, color });
  }
}
function scoreAdd(base, x, y, label) {
  const pts = Math.round(base * combo);
  score += pts;
  addPopup(x, y, '+' + pts, label || '#ffd23e');
  if (score > high) { high = score; try { localStorage.setItem('ah_high', String(high)); } catch (e) {} }
  return pts;
}
function bumpCombo() {
  const now = performance.now() / 1000;
  if (now - comboT < 2.5) combo = Math.min(5, combo + 1);
  else combo = 1;
  comboT = now;
  if (combo > 1) {
    comboEl.style.display = 'block';
    comboEl.textContent = 'COMBO x' + combo;
  }
}
function addCharge(v) {
  charge = Math.min(100, charge + v);
  sfx.charge();
}
function useBoost() {
  if (boostActive || charge < 100 || state !== 'play') return;
  boostActive = true; boostT = 2.2; charge = 0;
  sfx.boost();
  addPopup(player.x, player.y + 60, 'AFTERBURNER!', '#ff5e00');
  flashT = 0.3;
}

// ---------- game flow ----------
function servePuck(toPlayer) {
  puck.x = 0;
  if (toPlayer) {
    // player's serve: puck rests in player half, away from the paddle home
    player.x = 0; player.y = -500;
    player.tx = 0; player.ty = -500;
    puck.y = -300;
    puck.vx = (Math.random() - 0.5) * 200;
    puck.vy = 0;
  } else {
    // opponent's serve: puck launched toward the player
    opp.x = 0; opp.y = OPP_Y;
    puck.y = 200;
    puck.vx = (Math.random() - 0.5) * 300;
    puck.vy = -500;
  }
  puck.onTable = true;
  serveT = 0;
  rally = 0;
}
function startGame() {
  score = 0; oppScore = 0; charge = 0; combo = 1;
  boostActive = false; phase = 'normal'; phaseT = 0; phaseCd = 0;
  playerHitCd = 0; oppHitCd = 0;
  scoreEl.textContent = '0';
  highEl.textContent = high;
  overlay.style.display = 'none';
  player.x = 0; player.y = PLAYER_Y;
  opp.x = 0; opp.y = OPP_Y;
  servePuck(true);
  state = 'play';
}
startBtn.addEventListener('click', startGame);
window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const k = e.key;
  if (k === ' ') { if (state === 'title' || state === 'over') startGame(); else useBoost(); e.preventDefault(); }
  if (k === 'r' || k === 'R') { if (state === 'over' || state === 'title') startGame(); }
  if (k === 'm' || k === 'M') { muted = !muted; try { localStorage.setItem('ah_mute', muted ? '1' : '0'); } catch (e) {} setMuteUI(); }
});
// mouse control
sceneEl.addEventListener('mousemove', (e) => {
  if (state !== 'play') return;
  const rect = renderer.domElement.getBoundingClientRect();
  const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  const ny = ((e.clientY - rect.top) / rect.height) * 2 - 1;
  // map to rink: x full width, y only player half
  player.tx = nx * (RW - PADDLE_R - 20);
  player.ty = clamp(ny * RH * 0.9, -RH + PADDLE_R + 30, -40);
});
// touch: drag anywhere on player half
sceneEl.addEventListener('touchmove', (e) => {
  if (state !== 'play') return;
  const t = e.touches[0];
  const rect = renderer.domElement.getBoundingClientRect();
  const nx = ((t.clientX - rect.left) / rect.width) * 2 - 1;
  const ny = ((t.clientY - rect.top) / rect.height) * 2 - 1;
  player.tx = nx * (RW - PADDLE_R - 20);
  player.ty = clamp(ny * RH * 0.9, -RH + PADDLE_R + 30, -40);
  e.preventDefault();
}, { passive: false });
sceneEl.addEventListener('touchstart', (e) => {
  if (state === 'title' || state === 'over') { startGame(); return; }
  const t = e.touches[0];
  const rect = renderer.domElement.getBoundingClientRect();
  const nx = ((t.clientX - rect.left) / rect.width) * 2 - 1;
  const ny = ((t.clientY - rect.top) / rect.height) * 2 - 1;
  player.tx = nx * (RW - PADDLE_R - 20);
  player.ty = clamp(ny * RH * 0.9, -RH + PADDLE_R + 30, -40);
}, { passive: true });
// keyboard paddle movement
const keys = {};
window.addEventListener('keydown', (e) => { keys[e.key] = true; });
window.addEventListener('keyup', (e) => { keys[e.key] = false; });

// ---------- physics ----------
function circleCollide(a, b, rest) {
  // n points from b (paddle) to a (puck)
  const dx = a.x - b.x, dy = a.y - b.y;
  const d2 = dx * dx + dy * dy;
  const minD = a.r + b.r;
  if (d2 >= minD * minD) return false;
  let nx, ny;
  if (d2 === 0) { nx = 0; ny = 1; }
  else { const d = Math.sqrt(d2); nx = dx / d; ny = dy / d; }
  // push puck out
  a.x = b.x + nx * minD;
  a.y = b.y + ny * minD;
  // reflect relative velocity if approaching (paddle may be the mover)
  const bvx = b.vx || 0, bvy = b.vy || 0;
  const rel = (a.vx - bvx) * nx + (a.vy - bvy) * ny;
  if (rel < 0) {
    a.vx -= (1 + rest) * rel * nx;
    a.vy -= (1 + rest) * rel * ny;
  }
  return true;
}
function puckWall() {
  if (puck.x > RW - PUCK_R) { puck.x = RW - PUCK_R; puck.vx = -Math.abs(puck.vx) * 0.75; sfx.wall(); }
  if (puck.x < -RW + PUCK_R) { puck.x = -RW + PUCK_R; puck.vx = Math.abs(puck.vx) * 0.75; sfx.wall(); }
  // goals: check before wall bounce
  const inGoalX = Math.abs(puck.x) < GOAL_W / 2 - PUCK_R;
  if (puck.y > RH - PUCK_R) {
    if (inGoalX) { playerGoal(); return; }
    puck.y = RH - PUCK_R; puck.vy = -Math.abs(puck.vy) * 0.75; sfx.wall();
  }
  if (puck.y < -RH + PUCK_R) {
    if (inGoalX) { oppGoal(); return; }
    puck.y = -RH + PUCK_R; puck.vy = Math.abs(puck.vy) * 0.75; sfx.wall();
  }
  // goal posts
  for (const px of [-GOAL_W / 2, GOAL_W / 2]) {
    for (const py of [RH, -RH]) {
      const dx = puck.x - px, dy = puck.y - py;
      const d2 = dx * dx + dy * dy;
      if (d2 < (PUCK_R + 10) * (PUCK_R + 10) && d2 > 0) {
        const d = Math.sqrt(d2);
        puck.x = px + dx / d * (PUCK_R + 10);
        puck.y = py + dy / d * (PUCK_R + 10);
        const vn = puck.vx * dx / d + puck.vy * dy / d;
        if (vn < 0) { puck.vx -= 1.6 * vn * dx / d; puck.vy -= 1.6 * vn * dy / d; }
        sfx.wall();
      }
    }
  }
}
function playerGoal() {
  // player scored
  scoreAdd(1000, 0, RH - 60, '#ffd23e');
  addParts(0, RH - 20, 0xff3d81, 20);
  goalFlash = 0.5;
  shake = 0.3;
  sfx.goal();
  bumpCombo();
  addCharge(20);
  // bonus zone check
  for (const z of bonusZones) {
    if (z.active) {
      scoreAdd(1000, z.x, z.y, '#ffb300');
      addPopup(0, RH - 120, 'BONUS ZONE!', '#ffb300');
      z.active = false;
    }
  }
  servePuck(false);
}
function oppGoal() {
  oppScore++;
  addParts(0, -RH + 20, 0x00d4ff, 20);
  goalFlash = -0.5;
  shake = 0.3;
  sfx.oppGoal();
  combo = 1; comboEl.style.display = 'none';
  if (boostActive) { boostActive = false; }
  if (oppScore >= firstTo) {
    gameOver();
    return;
  }
  servePuck(true);
}
function gameOver() {
  state = 'over';
  sfx.over();
  const isNew = score >= high && score > 0;
  finalScore.textContent = score;
  finalHigh.textContent = 'High score: ' + high;
  finalNew.style.display = isNew ? 'block' : 'none';
  overlay.style.display = 'flex';
}

// opponent AI
let oppReactT = 0;
function oppAI(dt) {
  // difficulty escalates with score
  const diff = clamp(0.4 + score / 20000, 0.4, 0.95);
  opp.skill = diff;
  // reaction delay: when the puck enters the opponent's half, it freezes
  // for a human-like reaction time before committing. This is the player's
  // scoring window — a fast shot arrives before the defense can cover.
  if (puck.vy > 0 && puck.y > 0) {
    if (oppReactT <= 0) oppReactT = 0.55 - diff * 0.3; // 0.265..0.43s
  } else {
    oppReactT = 0;
  }
  let targetX, targetY;
  if (oppReactT > 0) {
    // frozen: hold position
    targetX = opp.x;
    targetY = opp.y;
  } else if (puck.vy > 0 && puck.y > -50) {
    // committed: track the puck's CURRENT x (no perfect prediction)
    targetX = puck.x;
    targetY = opp.y;
  } else {
    // puck in player half: hold center, drift slightly
    targetX = puck.x * 0.25;
    targetY = OPP_Y;
  }
  targetX = clamp(targetX, -RW + PADDLE_R + 20, RW - PADDLE_R - 20);
  targetY = clamp(targetY, 40, RH - PADDLE_R - 20);
  // smooth pursuit with reaction delay
  opp.react = Math.max(0.12, 0.35 - diff * 0.25);
  const k = 1 - Math.pow(0.001, dt / opp.react);
  const nx = opp.x + (targetX - opp.x) * k;
  const ny = opp.y + (targetY - opp.y) * k;
  // opponent has a real speed limit: it cannot teleport across the rink
  const maxSpeed = 300 + diff * 150; // 360..442 px/s
  let dx = nx - opp.x, dy = ny - opp.y;
  const dist = Math.hypot(dx, dy);
  if (dist > maxSpeed * dt) {
    dx *= (maxSpeed * dt) / dist;
    dy *= (maxSpeed * dt) / dist;
  }
  opp.x += dx;
  opp.y += dy;
  opp.vx = dx / Math.max(dt, 0.001);
  opp.vy = dy / Math.max(dt, 0.001);
  // pressure phase: opponent plays aggressively
  if (phase === 'pressure') {
    opp.x += Math.sin(performance.now() / 300) * 60 * dt;
  }
}

function physics(dt) {
  if (state !== 'play') return;
  // player movement
  const kp = 1 - Math.pow(0.001, dt / 0.08);
  if (player.tx !== undefined) {
    player.x += (player.tx - player.x) * kp;
    player.y += (player.ty - player.y) * kp;
  } else if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= 700 * dt;
  else if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += 700 * dt;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y += 700 * dt;
  else if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y -= 700 * dt;
  player.x = clamp(player.x, -RW + PADDLE_R + 20, RW - PADDLE_R - 20);
  player.y = clamp(player.y, -RH + PADDLE_R + 30, -40);
  player.vx = (player.x - (player.px || player.x)) / Math.max(dt, 0.001);
  player.vy = (player.y - (player.py || player.y)) / Math.max(dt, 0.001);
  player.px = player.x; player.py = player.y;

  // afterburner boost: paddle speed boost + puck launch
  if (boostActive) {
    boostT -= dt;
    if (boostT <= 0) boostActive = false;
  }

  oppAI(dt);

  // puck physics
  if (puck.onTable) {
    puck.x += puck.vx * dt;
    puck.y += puck.vy * dt;
    const f = boostActive ? 0.99 : FRICTION;
    puck.vx *= Math.pow(f, dt * 60);
    puck.vy *= Math.pow(f, dt * 60);
    const sp = Math.hypot(puck.vx, puck.vy);
    const speedCap = boostActive ? 2200 : MAX_SPEED;
    if (sp > speedCap) { puck.vx *= speedCap / sp; puck.vy *= speedCap / sp; }

    // paddle collisions (with hit cooldown so a sweep doesn't re-hit every frame)
    playerHitCd = Math.max(0, playerHitCd - dt);
    oppHitCd = Math.max(0, oppHitCd - dt);
    const hitP = playerHitCd <= 0 && circleCollide(puck, player, 0.85);
    if (hitP) {
      playerHitCd = 0.12;
      // paddle velocity adds power; boost adds a burning impulse
      const boostMul = boostActive ? 2.2 : 1;
      puck.vx += player.vx * 0.8 * boostMul;
      puck.vy += player.vy * 0.8 * boostMul;
      if (boostActive) {
        // impulse along the contact normal (from paddle to puck)
        const dx = puck.x - player.x, dy = puck.y - player.y;
        const d = Math.hypot(dx, dy) || 1;
        puck.vx += (dx / d) * 700;
        puck.vy += (dy / d) * 700;
      }
      const sp2 = Math.hypot(puck.vx, puck.vy);
      const cap2 = boostActive ? 2200 : MAX_SPEED;
      if (sp2 > cap2) { puck.vx *= cap2 / sp2; puck.vy *= cap2 / sp2; }
      sfx.hit();
      addParts(puck.x, puck.y, 0x00d4ff, 6);
      // rally: clean save = charge
      rally++;
      lastHitT = performance.now() / 1000;
      addCharge(6);
      bumpCombo();
      if (boostActive) addPopup(puck.x, puck.y + 40, 'BURNING SHOT!', '#ff5e00');
    }
    const hitO = oppHitCd <= 0 && circleCollide(puck, opp, 0.8);
    if (hitO) {
      oppHitCd = 0.12;
      puck.vx += opp.vx * 0.4;
      puck.vy += opp.vy * 0.4;
      sfx.hit();
      addParts(puck.x, puck.y, 0xff3d81, 6);
    }
    puckWall();
  }

  // bonus zones
  for (let i = 0; i < bonusZones.length; i++) {
    const z = bonusZones[i];
    const dx = puck.x - z.x, dy = puck.y - z.y;
    if (dx * dx + dy * dy < z.r * z.r && !z.active) {
      z.active = true;
      z.t = 8;
      sfx.bonus();
      addPopup(z.x, z.y, 'BONUS ZONE!', '#ffb300');
      addParts(z.x, z.y, 0xffb300, 10);
    }
    if (z.active) {
      z.t -= dt;
      if (z.t <= 0) z.active = false;
    }
  }

  // phases: pressure waves
  phaseCd -= dt;
  if (phase === 'normal' && phaseCd <= 0 && score > 0) {
    phase = 'pressure';
    phaseT = 6;
    phaseEl.style.display = 'block';
    addPopup(0, 0, 'PRESSURE WAVE!', '#ff3d81');
    sfx.over();
  }
  if (phase === 'pressure') {
    phaseT -= dt;
    if (phaseT <= 0) {
      phase = 'normal';
      phaseCd = 12;
      phaseEl.style.display = 'none';
    }
  }
}

// ---------- render ----------
function render(dt, t) {
  puckMesh.position.set(puck.x, puck.y, 0);
  puckGlow.position.set(puck.x, puck.y, -2);
  const sp = Math.hypot(puck.vx, puck.vy);
  puckGlow.material.opacity = clamp(0.1 + sp / 3000, 0.1, 0.4);
  playerMesh.position.set(player.x, player.y, 0);
  oppMesh.position.set(opp.x, opp.y, 0);
  // boost visual
  playerMesh.scale.set(boostActive ? 1.25 : 1, boostActive ? 1.25 : 1, 1);
  playerMesh.children[0].material.emissiveIntensity = boostActive ? 1.4 : 0.5;
  // bonus zone pulse
  for (let i = 0; i < bonusZones.length; i++) {
    const z = bonusZones[i];
    bonusMeshes[i].material.emissiveIntensity = z.active ? 1.2 + Math.sin(t * 8) * 0.5 : 0.3;
  }
  // goal flash
  if (goalFlash > 0) { goalFlash -= dt; goalTop.material.emissiveIntensity = 0.9 + goalFlash * 2; }
  else if (goalFlash < 0) { goalFlash += dt; goalBot.material.emissiveIntensity = 0.9 - goalFlash * 2; }
  else { goalTop.material.emissiveIntensity = 0.9; goalBot.material.emissiveIntensity = 0.9; }
  // particles
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.t > p.life) { parts.splice(i, 1); i--; }
  }
  // camera shake
  if (shake > 0) {
    shake -= dt;
    camera.position.x = (Math.random() - 0.5) * shake * 30;
    camera.position.y = (Math.random() - 0.5) * shake * 30;
  } else {
    camera.position.x = 0; camera.position.y = 0;
  }
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);

  // HUD
  scoreEl.textContent = score;
  highEl.textContent = high;
  chargeFill.style.width = boostActive ? '100%' : charge + '%';
  if (combo > 1 && performance.now() / 1000 - comboT > 2.5) {
    combo = 1;
    comboEl.style.display = 'none';
  }
}

// ---------- main loop ----------
let last = performance.now();
let paused = false;
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (!paused) {
    physics(dt);
    render(dt, now / 1000);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- test hooks (only with ?test=1) ----------
if (TEST) {
  window.__airhockey = {
    get state() { return state; },
    get score() { return score; },
    get oppScore() { return oppScore; },
    get high() { return high; },
    get charge() { return charge; },
    get boostActive() { return boostActive; },
    get combo() { return combo; },
    get phase() { return phase; },
    get puck() { return { x: puck.x, y: puck.y, vx: puck.vx, vy: puck.vy }; },
    get player() { return { x: player.x, y: player.y }; },
    get opp() { return { x: opp.x, y: opp.y }; },
    get bonusZones() { return bonusZones.map(z => z.active); },
    start: startGame,
    serve: servePuck,
    setPuck: (x, y, vx, vy) => { puck.x = x; puck.y = y; puck.vx = vx || 0; puck.vy = vy || 0; puck.onTable = true; },
    setPlayer: (x, y) => { player.x = x; player.y = y; player.tx = x; player.ty = y; },
    setCharge: (v) => { charge = clamp(v, 0, 100); },
    boost: useBoost,
    step: (n) => { for (let i = 0; i < (n || 1); i++) physics(1 / 60); },
    pause: () => { paused = true; },
    resume: () => { paused = false; },
  };
}

startGame();
</script>
