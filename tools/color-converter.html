<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Color Converter - HEX, RGB, HSL, HSV Converter","description":"Free color converter between HEX, RGB, HSL, and HSV color formats. Convert any color code and get color previews.","url":"https://business2-lasse-tfa.vercel.app/tools/color-converter.html","applicationCategory":"UtilitiesApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"EUR"}}</script>

<body>
    <div class="container">
        <h1>Color Converter</h1>
        <p class="subtitle">Convert between HEX, RGB, HSL, and HSV color formats</p>
        
        <div class="input-group">
            <label>HEX Code (e.g., #ff0000)</label>
            <input type="text" id="hexInput" value="#ff0000" maxlength="7" placeholder="#ff0000" pattern="^#[0-9A-Fa-f]{6}$">
        </div>
        
        <div class="formats" id="formats"></div>
        
        <button class="btn" onclick="convertColor()">Convert</button>
        
        <div class="results" id="results">
            <div style="text-align: center; margin-bottom: 20px;">
                <div class="color-preview" id="colorPreview" style="background: #ff0000;"></div>
            </div>
            <div class="format-group">
                <div class="format-label">RGB</div>
                <div class="format-value" id="rgbOutput">rgb(0, 0, 0)</div>
            </div>
            <div class="format-group">
                <div class="format-label">HSL</div>
                <div class="format-value" id="hslOutput">hsl(0, 0%, 0%)</div>
            </div>
            <div class="format-group">
                <div class="format-label">HSV</div>
                <div class="format-value" id="hsvOutput">hsv(0, 0%, 0%)</div>
            </div>
        </div>
    </div>

    <script>
        // `showErrors` is false while the user is still typing, so a half-finished
        // hex code does not raise an alert on every keystroke.
        function convertColor(showErrors = true) {
            const hexInput = document.getElementById('hexInput').value.trim();
            const hex = hexInput.replace('#', '');
            
            if (!/^[0-9A-Fa-f]{6}$/.test(hex)) {
                if (showErrors) alert('Please enter a valid HEX code (6 hex characters, e.g., #ff0000)');
                return;
            }
            
            // Parse HEX to RGB
            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);
            
            // RGB
            document.getElementById('rgbOutput').textContent = `rgb(${r}, ${g}, ${b})`;
            
            // HSL
            const rNorm = r / 255;
            const gNorm = g / 255;
            const bNorm = b / 255;
            
            const max = Math.max(rNorm, gNorm, bNorm);
            const min = Math.min(rNorm, gNorm, bNorm);
            let h, s, l = (max + min) / 2;
            
            if (max === min) {
                h = s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                
                switch (max) {
                    case rNorm: h = (60 * ((gNorm - bNorm) / d) + 360) % 360; break;
                    case gNorm: h = (60 * ((bNorm - rNorm) / d) + 120) % 360; break;
                    case bNorm: h = (60 * ((rNorm - gNorm) / d) + 240) % 360; break;
                }
                s = s * 100;
            }
            
            const hslStr = `${Math.round(h)}, ${Math.round(s)}%, ${Math.round(l * 100)}%`;
            document.getElementById('hslOutput').textContent = `hsl(${hslStr})`;
            
            // HSV
            const v = max;
            const sV = max === 0 ? 0 : (max - min) / max;
            const hsvStr = `${Math.round(h)}, ${Math.round(sV * 100)}%, ${Math.round(v * 100)}%`;
            document.getElementById('hsvOutput').textContent = `hsv(${hsvStr})`;
            
            // Update preview
            document.getElementById('colorPreview').style.background = hexInput;
            
            document.getElementById('results').classList.add('visible');
        }
        
        // Auto-convert on input
        document.getElementById('hexInput').addEventListener('keypress', e => { if (e.key === 'Enter') convertColor(); });
        document.getElementById('hexInput').addEventListener('input', () => convertColor(false));
        
        convertColor();
    </script>
