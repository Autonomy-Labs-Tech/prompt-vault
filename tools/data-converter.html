<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Data Converter Tool</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; background: #f5f5f5; }
        .container { background: white; border-radius: 12px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        .subtitle { color: #7f8c8d; margin-bottom: 30px; }
        .formats { display: flex; gap: 10px; margin-bottom: 20px; }
        .format-btn { padding: 10px 20px; background: #ecf0f1; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .format-btn.active { background: #3498db; color: white; border-color: #3498db; }
        .converter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        .converter-group { background: #f8f9fa; padding: 16px; border-radius: 8px; }
        .converter-group label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 14px; }
        .converter-group input, .converter-group select { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 6px; font-size: 14px; }
        .result-box { background: #ecf0f1; border-radius: 8px; padding: 24px; margin-top: 20px; text-align: center; border: 2px solid #3498db; }
        .result-box h2 { color: #2c3e50; margin-bottom: 12px; }
        .download-btn { display: inline-block; margin-top: 16px; padding: 12px 24px; background: #3498db; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; }
        .error { color: #e74c3c; }
        footer { margin-top: 40px; text-align: center; color: #95a5a6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Data Converter Tool</h1>
        <p class="subtitle">Convert between JSON, CSV, XML, and other formats</p>
        
        <div class="formats">
            <button class="format-btn active" onclick="showFormat('json', this)">JSON</button>
            <button class="format-btn" onclick="showFormat('csv', this)">CSV</button>
            <button class="format-btn" onclick="showFormat('xml', this)">XML</button>
            <button class="format-btn" onclick="showFormat('all', this)">All Formats</button>
        </div>
        
        <div class="converter-grid">
            <div class="converter-group">
                <label>From (JSON, CSV, or XML)</label>
                <select id="fromFormat" onchange="showFormat(this.value, null);">
                    <option value="json">JSON</option>
                    <option value="csv">CSV</option>
                    <option value="xml">XML</option>
                </select>
                <input type="text" id="input" placeholder='{"field":"value"}' oninput="updatePreview()">
            </div>
            <div class="converter-group">
                <label>To</label>
                <select id="toFormat" onchange="showFormat(this.value, null);">
                    <option value="json">JSON</option>
                    <option value="csv">CSV</option>
                    <option value="xml">XML</option>
                </select>
            </div>
            <div class="converter-group">
                <label>Size (bytes)</label>
                <input type="text" id="size" readonly value="0">
            </div>
            <div class="converter-group">
                <label>To/From Size (optional)</label>
                <input type="text" id="sizeFrom" placeholder="New size if different">
            </div>
        </div>
        
        <div class="result-box">
            <h2>Output</h2>
            <pre id="output" style="margin: 12px 0; padding: 12px; background: #2c3e50; color: #ecf0f1; border-radius: 6px; overflow-x: auto;"></pre>
            <a href="data:text/csv;charset=utf-8," + encodeURIComponent('converted_data.csv') + '" class="download-btn" download="output.csv" onclick="downloadOutput('csv')">Download CSV</a>
            <a href="data:text/xml;charset=utf-8," + encodeURIComponent('converted_data.xml') + '" class="download-btn" download="output.xml" onclick="downloadOutput('xml')">Download XML</a>
        </div>
    </div>

    <script>
        let currentFormat = 'json';
        
        function showFormat(format, btn) {
            currentFormat = format;
            document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            document.getElementById('size').value = 0;
            document.getElementById('output').textContent = '';
            document.getElementById('output').classList.add('hidden');
        }
        
        document.getElementById('input').addEventListener('input', updatePreview);
        document.getElementById('fromFormat').addEventListener('change', function() { showFormat(this.value, this); updatePreview(); });
        document.getElementById('toFormat').addEventListener('change', function() { showFormat(this.value, this); clearOutput(); });
        
        function updatePreview() {
            const input = document.getElementById('input').value;
            const size = input.length;
            document.getElementById('size').value = size;
            
            try {
                const parsed = JSON.parse(input);
                const json = JSON.stringify(parsed, null, 2);
                document.getElementById('output').textContent = json;
                document.getElementById('output').classList.remove('hidden');
                document.querySelector('.result-box h2').textContent = 'Output (JSON)';
            } catch (e) {
                // Try CSV
                const lines = input.split('\n').filter(l => l.trim());
                document.getElementById('output').textContent = `CSV Lines: ${lines.length}\n(Use CSV format for tables)`;
                document.getElementById('output').classList.remove('hidden');
                document.querySelector('.result-box h2').textContent = 'Output (CSV)';
            }
        }
        
        function clearOutput() {
            document.getElementById('output').classList.add('hidden');
        }
        
        function downloadOutput(format) {
            const output = document.getElementById('output');
            if (output.classList.contains('hidden') || !output.textContent) {
                alert('No output to download');
                return;
            }
            const content = output.textContent;
            const filename = 'converted.' + format;
            
            if (format === 'csv') {
                const csv = content.replace(/\n$/g, '').replace(/\r/g, '');
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } else if (format === 'xml') {
                const blob = new Blob([content], { type: 'application/xml' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }
    </script>
</body>
</html>
