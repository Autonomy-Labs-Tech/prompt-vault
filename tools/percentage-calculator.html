<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Calculator - Free Percentage Calculator</title>
    <meta name="description" content="Free percentage calculator for all percentage calculations. Calculate percentages, percentage increase/decrease, and more. Instant results.">
    <meta name="keywords" content="percentage calculator, percent calculator, calculate percentage, percentage increase, percentage decrease">
    <link rel="canonical" href="https://autonomylabsweb.tech/tools/percentage-calculator.html">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 25px;
            background: #f0f0f0;
            padding: 5px;
            border-radius: 10px;
            flex-wrap: wrap;
        }

        .tab {
            flex: 1;
            padding: 12px 8px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s;
            text-align: center;
        }

        .tab.active {
            background: #667eea;
            color: white;
        }

        .calculator-section {
            display: none;
        }

        .calculator-section.active {
            display: block;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .calculate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            background: #f9f9f9;
            border: 2px solid #667eea;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 32px;
            font-weight: 700;
            color: #333;
        }

        .formula {
            margin-top: 15px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            font-size: 13px;
            color: #2e7d32;
        }

        .formula-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }

            .tab {
                font-size: 11px;
                padding: 10px 5px;
            }

            .result-value {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Percentage Calculator</h1>
        <p class="subtitle">Calculate percentages, increases, decreases and more</p>

        <div class="tabs">
            <button class="tab active" onclick="showTab('what-percent')">What is %</button>
            <button class="tab" onclick="showTab('percent-of')">% of What</button>
            <button class="tab" onclick="showTab('percent-change')">% Change</button>
        </div>

        <!-- What is X% of Y -->
        <div class="calculator-section active" id="what-percent">
            <div class="input-group">
                <label>What is</label>
                <input type="number" id="wp-percent" placeholder="Enter percentage" step="0.01">
            </div>
            <div class="input-group">
                <label>% of</label>
                <input type="number" id="wp-number" placeholder="Enter number" step="0.01">
            </div>
            <button class="calculate-btn" onclick="calculateWhatPercent()">Calculate</button>
            <div class="result" id="wp-result">
                <div class="result-label">Result:</div>
                <div class="result-value" id="wp-value">0</div>
                <div class="formula">
                    <div class="formula-title">Formula:</div>
                    <div id="wp-formula">X% of Y = (X/100) × Y</div>
                </div>
            </div>
        </div>

        <!-- X is what % of Y -->
        <div class="calculator-section" id="percent-of">
            <div class="input-group">
                <label></label>
                <input type="number" id="po-number" placeholder="Enter number" step="0.01">
            </div>
            <div class="input-group">
                <label>is what % of</label>
                <input type="number" id="po-total" placeholder="Enter total" step="0.01">
            </div>
            <button class="calculate-btn" onclick="calculatePercentOf()">Calculate</button>
            <div class="result" id="po-result">
                <div class="result-label">Result:</div>
                <div class="result-value" id="po-value">0%</div>
                <div class="formula">
                    <div class="formula-title">Formula:</div>
                    <div id="po-formula">X is what % of Y = (X/Y) × 100</div>
                </div>
            </div>
        </div>

        <!-- Percentage Change -->
        <div class="calculator-section" id="percent-change">
            <div class="input-group">
                <label>From</label>
                <input type="number" id="pc-from" placeholder="Enter original value" step="0.01">
            </div>
            <div class="input-group">
                <label>To</label>
                <input type="number" id="pc-to" placeholder="Enter new value" step="0.01">
            </div>
            <button class="calculate-btn" onclick="calculatePercentChange()">Calculate</button>
            <div class="result" id="pc-result">
                <div class="result-label">Result:</div>
                <div class="result-value" id="pc-value">0%</div>
                <div class="formula">
                    <div class="formula-title">Formula:</div>
                    <div id="pc-formula">% Change = ((New - Original) / Original) × 100</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showTab(tabId) {
            // Hide all sections
            document.querySelectorAll('.calculator-section').forEach(section => {
                section.classList.remove('active');
            });
            
            // Remove active class from all tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show selected section
            document.getElementById(tabId).classList.add('active');
            
            // Add active class to clicked tab
            event.target.classList.add('active');
            
            // Hide all results
            document.querySelectorAll('.result').forEach(result => {
                result.classList.remove('show');
            });
        }

        function calculateWhatPercent() {
            const percent = parseFloat(document.getElementById('wp-percent').value);
            const number = parseFloat(document.getElementById('wp-number').value);
            
            if (isNaN(percent) || isNaN(number)) {
                alert('Please enter valid numbers');
                return;
            }
            
            const result = (percent / 100) * number;
            const rounded = Math.round(result * 100) / 100;
            
            document.getElementById('wp-value').textContent = rounded;
            document.getElementById('wp-formula').textContent = 
                `${percent}% of ${number} = (${percent}/100) × ${number} = ${rounded}`;
            document.getElementById('wp-result').classList.add('show');
        }

        function calculatePercentOf() {
            const number = parseFloat(document.getElementById('po-number').value);
            const total = parseFloat(document.getElementById('po-total').value);
            
            if (isNaN(number) || isNaN(total) || total === 0) {
                alert('Please enter valid numbers (total cannot be 0)');
                return;
            }
            
            const result = (number / total) * 100;
            const rounded = Math.round(result * 100) / 100;
            
            document.getElementById('po-value').textContent = rounded + '%';
            document.getElementById('po-formula').textContent = 
                `${number} is what % of ${total} = (${number}/${total}) × 100 = ${rounded}%`;
            document.getElementById('po-result').classList.add('show');
        }

        function calculatePercentChange() {
            const from = parseFloat(document.getElementById('pc-from').value);
            const to = parseFloat(document.getElementById('pc-to').value);
            
            if (isNaN(from) || isNaN(to) || from === 0) {
                alert('Please enter valid numbers (original value cannot be 0)');
                return;
            }
            
            const result = ((to - from) / from) * 100;
            const rounded = Math.round(result * 100) / 100;
            const changeType = result >= 0 ? 'increase' : 'decrease';
            
            document.getElementById('pc-value').textContent = rounded + '%';
            document.getElementById('pc-formula').textContent = 
                `Change from ${from} to ${to} = ((${to} - ${from}) / ${from}) × 100 = ${rounded}% (${changeType})`;
            document.getElementById('pc-result').classList.add('show');
        }

        // Allow Enter key to calculate
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const activeSection = document.querySelector('.calculator-section.active');
                if (activeSection.id === 'what-percent') {
                    calculateWhatPercent();
                } else if (activeSection.id === 'percent-of') {
                    calculatePercentOf();
                } else if (activeSection.id === 'percent-change') {
                    calculatePercentChange();
                }
            }
        });
    </script>
</body>
</html>
