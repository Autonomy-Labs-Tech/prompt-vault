<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Password Generator - Secure Random Password Generator","description":"Free secure password generator. Create strong random passwords with customizable length, uppercase, lowercase, numbers, and symbols.","url":"https://business2-lasse-tfa.vercel.app/tools/password-generator.html","applicationCategory":"UtilitiesApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"EUR"}}</script>

<body>
    <div class="container">
        <h1>Password Generator</h1>
        <p class="subtitle">Create strong, secure random passwords</p>
        
        <div class="password-box">
            <div class="password-display" id="passwordDisplay">Click Generate</div>
            <div class="strength" id="strengthBar"></div>
            <div class="strength-label" id="strengthLabel"></div>
        </div>
        
        <div class="controls">
            <div class="control-row">
                <label>Length: <span class="length-value" id="lengthValue">16</span></label>
                <input type="range" id="length" min="8" max="64" value="16" oninput="updateLength()">
            </div>
            <div class="control-row">
                <label>Uppercase (A-Z)</label>
                <input type="checkbox" id="uppercase" checked>
            </div>
            <div class="control-row">
                <label>Lowercase (a-z)</label>
                <input type="checkbox" id="lowercase" checked>
            </div>
            <div class="control-row">
                <label>Numbers (0-9)</label>
                <input type="checkbox" id="numbers" checked>
            </div>
            <div class="control-row">
                <label>Symbols (!@#$%)</label>
                <input type="checkbox" id="symbols" checked>
            </div>
        </div>
        
        <button class="btn" onclick="generate()">Generate Password</button>
        <button class="btn secondary" onclick="copyPassword()">Copy to Clipboard</button>
    </div>

    <script>
        const display = document.getElementById('passwordDisplay');
        const strengthBar = document.getElementById('strengthBar');
        const strengthLabel = document.getElementById('strengthLabel');
        
        function updateLength() {
            document.getElementById('lengthValue').textContent = document.getElementById('length').value;
            generate();
        }
        
        function generate() {
            const length = parseInt(document.getElementById('length').value);
            const useUpper = document.getElementById('uppercase').checked;
            const useLower = document.getElementById('lowercase').checked;
            const useNumbers = document.getElementById('numbers').checked;
            const useSymbols = document.getElementById('symbols').checked;
            
            const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const lower = 'abcdefghijklmnopqrstuvwxyz';
            const numbers = '0123456789';
            const symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';
            
            let chars = '';
            if (useUpper) chars += upper;
            if (useLower) chars += lower;
            if (useNumbers) chars += numbers;
            if (useSymbols) chars += symbols;
            
            if (!chars) { display.textContent = 'Select at least one character type'; return; }
            
            // Use crypto.getRandomValues for secure randomness
            const randomValues = new Uint32Array(length);
            crypto.getRandomValues(randomValues);
            
            let password = '';
            for (let i = 0; i < length; i++) {
                password += chars[randomValues[i] % chars.length];
            }
            
            display.textContent = password;
            updateStrength(password, length);
        }
        
        function updateStrength(password, length) {
            let score = 0;
            if (length >= 12) score++;
            if (length >= 16) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;
            
            const levels = [
                { color: '#e74c3c', label: 'Weak' },
                { color: '#f39c12', label: 'Fair' },
                { color: '#f1c40f', label: 'Good' },
                { color: '#2ecc71', label: 'Strong' },
                { color: '#27ae60', label: 'Very Strong' },
                { color: '#1abc9c', label: 'Excellent' }
            ];
            const level = levels[Math.min(score, levels.length - 1)];
            strengthBar.style.background = level.color;
            strengthLabel.textContent = level.label;
        }
        
        async function copyPassword() {
            const password = display.textContent;
            if (!password || password === 'Click Generate') return;
            await navigator.clipboard.writeText(password);
            strengthLabel.textContent = '✓ Copied to clipboard';
        }
        
        generate();
    </script>
