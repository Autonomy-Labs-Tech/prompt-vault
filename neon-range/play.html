<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NEON RANGE — Autonomy Labs</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05060f;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
  #scene{position:fixed;inset:0;display:block;touch-action:none;cursor:crosshair;}
  #hud{position:fixed;top:0;left:0;right:0;padding:10px 14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5;color:#cfe8ff;text-shadow:0 0 8px rgba(0,180,255,.6);}
  .hud-block{display:flex;flex-direction:column;gap:2px;}
  .hud-label{font-size:10px;letter-spacing:2px;color:#7fb8e8;text-transform:uppercase;}
  .hud-value{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;}
  #hud .mid{display:flex;flex-direction:column;align-items:center;gap:3px;}
  #heat-wrap{width:150px;height:10px;border:1px solid #ff3d81;border-radius:5px;overflow:hidden;background:rgba(0,0,0,.5);}
  #heat-fill{height:100%;width:0%;background:linear-gradient(90deg,#00d4ff,#ff3d81);transition:width .15s;}
  #heat-label{font-size:9px;letter-spacing:2px;color:#ff3d81;text-transform:uppercase;}
  #timer{font-size:16px;font-weight:800;color:#ffd23e;font-variant-numeric:tabular-nums;}
  #combo{position:fixed;left:50%;top:64px;transform:translateX(-50%);font-size:24px;font-weight:900;color:#ffd23e;text-shadow:0 0 12px rgba(255,210,62,.8);display:none;z-index:5;pointer-events:none;}
  #popups{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden;}
  #popups .pop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;font-weight:900;text-shadow:0 0 12px rgba(0,0,0,.9);white-space:nowrap;animation:popfloat .9s ease-out forwards;}
  @keyframes popfloat{0%{opacity:0;scale:.6;}15%{opacity:1;scale:1.15;}30%{scale:1;}100%{opacity:0;scale:1.1;translate:0 -40px;}}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,6,16,.82);z-index:10;color:#e8f4ff;text-align:center;}
  #overlay h1{font-size:40px;margin:0 0 6px;letter-spacing:3px;background:linear-gradient(90deg,#00d4ff,#ff3d81,#ffb300);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;}
  #overlay h2{font-size:18px;margin:0 0 18px;color:#9fd4ff;font-weight:400;}
  #overlay .big{font-size:34px;font-weight:800;margin:6px 0;}
  #overlay .sub{font-size:14px;color:#7fb8e8;margin:2px 0;}
  #overlay .hint{margin-top:22px;font-size:13px;color:#5a7fa8;letter-spacing:1px;line-height:1.7;}
  #overlay button{margin-top:14px;padding:12px 34px;font-size:16px;font-weight:700;letter-spacing:2px;color:#04101a;background:linear-gradient(90deg,#00d4ff,#ff3d81);border:none;border-radius:30px;cursor:pointer;pointer-events:auto;}
  #overlay button:active{transform:scale(.96);}
  #mute{position:fixed;top:10px;right:14px;z-index:6;background:rgba(0,0,0,.4);border:1px solid #2a4a6a;color:#9fd4ff;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;pointer-events:auto;}
  #focus-btn{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:12px 26px;border-radius:30px;background:radial-gradient(circle at 35% 35%,#00d4ff,#7b5cff);border:2px solid #9fd4ff;color:#04101a;font-weight:900;font-size:13px;letter-spacing:2px;display:none;z-index:7;pointer-events:auto;box-shadow:0 0 20px rgba(0,212,255,.5);}
  #focus-btn:active{transform:translateX(-50%) scale(.94);}
</style>

<body>
<div id="scene"></div>
<div id="hud">
  <div class="hud-block">
    <span class="hud-label">Score</span>
    <span class="hud-value" id="score">0</span>
  </div>
  <div class="mid">
    <div id="timer">60</div>
    <div id="heat-label">Heat</div>
    <div id="heat-wrap"><div id="heat-fill"></div></div>
  </div>
  <div class="hud-block" style="align-items:flex-end;">
    <span class="hud-label">High Score</span>
    <span class="hud-value" id="high">0</span>
  </div>
</div>
<div id="combo"></div>
<div id="popups"></div>
<button id="mute">SOUND ON</button>
<button id="focus-btn">FOCUS</button>
<div id="overlay">
  <h1>NEON RANGE</h1>
  <h2>Discipline beats spray: hit the targets, spare the civilians, ride the heat</h2>
  <div class="big" id="final-score">0</div>
  <div class="sub" id="final-high">High score: 0</div>
  <div class="sub" id="final-new">NEW HIGH SCORE!</div>
  <div class="hint">MOUSE / TOUCH — aim &nbsp;·&nbsp; CLICK / TAP / SPACE — fire &nbsp;·&nbsp; F / FOCUS button — slow time &nbsp;·&nbsp; R — restart</div>
  <button id="start">START</button>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }

<script type="module">
import * as THREE from 'three';

/* ============================================================
   NEON RANGE — light-gun-gallery precision score attack
   Self-contained single file. No external assets, no build.
   ============================================================ */

const TEST = new URLSearchParams(location.search).has('test');

// ---------- state ----------
let score = 0, high = 0, combo = 1, comboT = 0, heat = 0;
let timeLeft = 60, state = 'title';        // title | play | over
let focus = false, focusT = 0, focusCd = 0;
let targets = [];                          // live targets
let nextSpawnT = 0, spawnInterval = 1.1;
let parts = [], popups = [];
let muted = false;
try { muted = localStorage.getItem('nr_mute') === '1'; } catch (e) {}
try { high = parseInt(localStorage.getItem('nr_high') || '0', 10) || 0; } catch (e) {}

// target roles: standard, civilian (no-shoot), gold (weak-point), pattern (changes spawn pattern)
const ROLES = {
  standard: { color: 0x00d4ff, pts: 100, life: 4, r: 52 },
  civilian: { color: 0x00ff88, pts: 0, life: 4.5, r: 52 },
  gold: { color: 0xffb300, pts: 400, life: 1.6, r: 44 },
  pattern: { color: 0x7b5cff, pts: 250, life: 3, r: 48 },
};

// ---------- renderer ----------
const sceneEl = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.setSize(window.innerWidth, window.innerHeight);
sceneEl.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060f);
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 4000);
camera.position.set(0, 0, 900);
camera.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0x334466, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(300, 600, 900);
scene.add(key);

// backdrop wall
const wall = new THREE.Mesh(
  new THREE.PlaneGeometry(1500, 1000),
  new THREE.MeshStandardMaterial({ color: 0x0a0f22, roughness: 0.8 })
);
wall.position.set(0, 0, -80);
scene.add(wall);
// horizon glow strips
for (let i = 0; i < 5; i++) {
  const strip = new THREE.Mesh(
    new THREE.PlaneGeometry(1500, 14),
    new THREE.MeshStandardMaterial({ color: 0x00d4ff, emissive: 0x00d4ff, emissiveIntensity: 0.25, transparent: true, opacity: 0.4 })
  );
  strip.position.set(0, 320 - i * 170, -79);
  scene.add(strip);
}

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const scoreEl = $('score'), highEl = $('high'), heatFill = $('heat-fill'), comboEl = $('combo'),
  overlay = $('overlay'), finalScore = $('final-score'), finalHigh = $('final-high'),
  finalNew = $('final-new'), startBtn = $('start'), muteBtn = $('mute'),
  timerEl = $('timer'), focusBtn = $('focus-btn');
function setMuteUI() { muteBtn.textContent = muted ? 'SOUND OFF' : 'SOUND ON'; }
muteBtn.addEventListener('click', () => { muted = !muted; try { localStorage.setItem('nr_mute', muted ? '1' : '0'); } catch (e) {} setMuteUI(); });
setMuteUI();

// ---------- audio ----------
let AC = null;
function audio() {
  if (muted) return null;
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, slide) {
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, ac.currentTime + dur);
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur + 0.02);
}
function noise(dur, vol) {
  const ac = audio(); if (!ac) return;
  const n = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = ac.createBufferSource(); src.buffer = buf;
  const g = ac.createGain(); g.gain.value = vol;
  src.connect(g); g.connect(ac.destination); src.start();
}
const sfx = {
  fire: () => noise(0.06, 0.2),
  hit: () => tone(990, 0.1, 'square', 0.15, 660),
  civilian: () => tone(200, 0.25, 'sawtooth', 0.14, 100),
  gold: () => { tone(880, 0.1, 'sine', 0.22); setTimeout(() => tone(1175, 0.12, 'sine', 0.22), 90); },
  pattern: () => tone(520, 0.14, 'sine', 0.16, 780),
  focus: () => tone(330, 0.2, 'sine', 0.15, 660),
  over: () => { tone(440, 0.2, 'sine', 0.15); setTimeout(() => tone(330, 0.25, 'sine', 0.15), 180); setTimeout(() => tone(220, 0.4, 'sine', 0.15), 360); },
};

// ---------- helpers ----------
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function addPopup(x, y, text, color) {
  popups.push({ x, y, text, color, t: 0, life: 0.9 });
}
function addParts(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 100 + Math.random() * 260;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.5, color });
  }
}
function scoreAdd(base, x, y, label) {
  const pts = Math.round(base * combo);
  score += pts;
  addPopup(x, y, '+' + pts, label || '#ffd23e');
  if (score > high) { high = score; try { localStorage.setItem('nr_high', String(high)); } catch (e) {} }
  return pts;
}
function bumpCombo() {
  const now = performance.now() / 1000;
  if (now - comboT < 3.5) combo = Math.min(5, combo + 1);
  else combo = 1;
  comboT = now;
  if (combo > 1) {
    comboEl.style.display = 'block';
    comboEl.textContent = 'COMBO x' + combo;
  }
}
function addHeat(v) {
  heat = clamp(heat + v, 0, 100);
  if (heat >= 100) focusBtn.style.display = 'block';
}
function useFocus() {
  if (focus || focusCd > 0 || state !== 'play') return;
  if (heat < 100) return;
  heat = 0;
  focus = true; focusT = 4; focusCd = 12;
  focusBtn.style.display = 'none';
  sfx.focus();
  addPopup(0, 200, 'FOCUS: SLOW TIME', '#00d4ff');
}

// ---------- targets ----------
function spawnTarget(role) {
  const r = ROLES[role];
  const x = (Math.random() - 0.5) * 1100;
  const y = (Math.random() - 0.5) * 600;
  const g = new THREE.Group();
  // body disc
  const body = new THREE.Mesh(
    new THREE.CircleGeometry(r.r, 28),
    new THREE.MeshStandardMaterial({ color: r.color, emissive: r.color, emissiveIntensity: 0.6, side: THREE.DoubleSide })
  );
  g.add(body);
  // ring
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(r.r + 6, 5, 8, 32),
    new THREE.MeshStandardMaterial({ color: r.color, emissive: r.color, emissiveIntensity: 0.8 })
  );
  ring.rotation.x = Math.PI / 2;
  g.add(ring);
  // role glyph (beyond colour): C=civilian, G=gold, P=pattern, blank=standard
  const cv = document.createElement('canvas');
  cv.width = 96; cv.height = 96;
  const cg = cv.getContext('2d');
  cg.font = 'bold 60px sans-serif';
  cg.textAlign = 'center'; cg.textBaseline = 'middle';
  cg.fillStyle = '#ffffff';
  if (role === 'civilian') cg.fillText('C', 48, 56);
  else if (role === 'gold') cg.fillText('G', 48, 56);
  else if (role === 'pattern') cg.fillText('P', 48, 56);
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sp.position.z = 4;
  sp.scale.set(56, 56, 1);
  g.add(sp);
  g.position.set(x, y, 0);
  scene.add(g);
  const t = {
    x, y, role, r: r.r, life: r.life, t: 0, mesh: g, flash: 0,
  };
  targets.push(t);
}
function roleForSpawn() {
  const roll = Math.random();
  // escalation: later in the run, gold and pattern appear more
  const elapsed = 60 - timeLeft;
  const goldP = 0.1 + elapsed / 600;
  const patternP = 0.08 + elapsed / 800;
  const civilianP = 0.18;
  if (roll < civilianP) return 'civilian';
  if (roll < civilianP + goldP) return 'gold';
  if (roll < civilianP + goldP + patternP) return 'pattern';
  return 'standard';
}

// ---------- firing ----------
function hitWorld(wx, wy) {
  // find hit target (nearest)
  let best = null, bestD = Infinity;
  for (const t of targets) {
    const dx = wx - t.x, dy = wy - t.y;
    const d = Math.hypot(dx, dy);
    if (d < t.r && d < bestD) { best = t; bestD = d; }
  }
  if (!best) {
    // miss: heat drops
    addHeat(-8);
    addPopup(wx, wy, 'MISS', '#7fb8e8');
    return;
  }
  const t = best;
  t.flash = 0.2;
  scene.remove(t.mesh);
  targets = targets.filter(x => x !== t);
  if (t.role === 'civilian') {
    heat = Math.max(0, heat - 30);
    addPopup(t.x, t.y + 30, 'CIVILIAN HIT! -HEAT', '#00ff88');
    sfx.civilian();
  } else if (t.role === 'gold') {
    bumpCombo();
    scoreAdd(400, t.x, t.y + 30, '#ffb300');
    addHeat(25);
    sfx.gold();
    addParts(t.x, t.y, 0xffb300, 10);
  } else if (t.role === 'pattern') {
    bumpCombo();
    scoreAdd(250, t.x, t.y + 30, '#7b5cff');
    addHeat(20);
    sfx.pattern();
    // pattern target changes the active spawn pattern: burst spawn
    for (let i = 0; i < 3; i++) setTimeout(() => spawnTarget('standard'), 200 + i * 250);
    addParts(t.x, t.y, 0x7b5cff, 10);
  } else {
    bumpCombo();
    scoreAdd(100, t.x, t.y + 30, '#00d4ff');
    addHeat(12);
    sfx.hit();
    addParts(t.x, t.y, 0x00d4ff, 6);
  }
  focusBtn.style.display = heat >= 100 && focusCd <= 0 ? 'block' : 'none';
}
function fire(clientX, clientY) {
  if (state !== 'play') return;
  sfx.fire();
  // raycast onto target plane (z=0)
  const rect = renderer.domElement.getBoundingClientRect();
  const ndcX = ((clientX - rect.left) / rect.width) * 2 - 1;
  const ndcY = -((clientY - rect.top) / rect.height) * 2 + 1;
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(ndcX, ndcY), camera);
  const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  const hit = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(plane, hit)) return;
  hitWorld(hit.x, hit.y);
}
sceneEl.addEventListener('click', (e) => {
  if (state === 'title' || state === 'over') { startGame(); return; }
  fire(e.clientX, e.clientY);
});
sceneEl.addEventListener('touchstart', (e) => {
  if (state === 'title' || state === 'over') { startGame(); return; }
  const t = e.touches[0];
  fire(t.clientX, t.clientY);
}, { passive: true });
window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const k = e.key;
  if (k === ' ') {
    if (state === 'title' || state === 'over') startGame();
    else fire(rectCenter().x, rectCenter().y);
    e.preventDefault();
  }
  if (k === 'f' || k === 'F') useFocus();
  if (k === 'r' || k === 'R') { if (state === 'over' || state === 'title') startGame(); }
  if (k === 'm' || k === 'M') { muted = !muted; try { localStorage.setItem('nr_mute', muted ? '1' : '0'); } catch (e) {} setMuteUI(); }
});
function rectCenter() {
  const r = renderer.domElement.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}
focusBtn.addEventListener('click', useFocus);

// ---------- flow ----------
function startGame() {
  score = 0; combo = 1; heat = 0; timeLeft = 60;
  focus = false; focusCd = 0; focusT = 0;
  spawnInterval = 1.1; nextSpawnT = 0.5;
  for (const t of targets) scene.remove(t.mesh);
  targets = [];
  scoreEl.textContent = '0';
  highEl.textContent = high;
  timerEl.textContent = '60';
  overlay.style.display = 'none';
  focusBtn.style.display = 'none';
  state = 'play';
}
startBtn.addEventListener('click', startGame);

function gameOver() {
  state = 'over';
  sfx.over();
  const isNew = score >= high && score > 0;
  finalScore.textContent = score;
  finalHigh.textContent = 'High score: ' + high;
  finalNew.style.display = isNew ? 'block' : 'none';
  overlay.style.display = 'flex';
}

// ---------- update ----------
function update(dt) {
  if (state !== 'play') return;
  // time (slowed during focus)
  const timeScale = focus ? 0.35 : 1;
  timeLeft -= dt * timeScale;
  timerEl.textContent = Math.max(0, Math.ceil(timeLeft));
  if (timeLeft <= 0) { gameOver(); return; }
  // focus
  if (focus) {
    focusT -= dt;
    if (focusT <= 0) { focus = false; addPopup(0, 200, 'FOCUS END', '#7fb8e8'); }
  }
  if (focusCd > 0) {
    focusCd -= dt;
    if (focusCd <= 0) focusBtn.style.display = heat >= 100 ? 'block' : 'none';
  }
  // spawning (interval tightens as time runs out)
  nextSpawnT -= dt * timeScale;
  if (nextSpawnT <= 0) {
    spawnTarget(roleForSpawn());
    const elapsed = 60 - timeLeft;
    spawnInterval = Math.max(0.45, 1.1 - elapsed / 90);
    nextSpawnT = spawnInterval;
  }
  // target aging
  for (let i = targets.length - 1; i >= 0; i--) {
    const t = targets[i];
    t.t += dt * timeScale;
    if (t.flash > 0) t.flash -= dt;
    if (t.t > t.life) {
      // expired: standard = missed, civilian = OK (spared), gold/pattern = missed
      scene.remove(t.mesh);
      targets.splice(i, 1);
      if (t.role !== 'civilian') {
        addHeat(-5);
        combo = 1; comboEl.style.display = 'none';
      }
    }
  }
  // combo decay
  if (combo > 1 && performance.now() / 1000 - comboT > 3.5) {
    combo = 1;
    comboEl.style.display = 'none';
  }
  // particles
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.t > p.life) { parts.splice(i, 1); i--; }
  }
  // popups
  for (let pi = 0; pi < popups.length; pi++) {
    const p = popups[pi];
    p.t += dt;
    if (p.t > p.life) { popups.splice(pi, 1); pi--; }
  }
}

// ---------- render ----------
let shake = 0;
function render(dt, t) {
  // target pulse
  for (const tg of targets) {
    const p = 1 + Math.sin(t * 5 + tg.x) * 0.04;
    tg.mesh.scale.set(p, p, 1);
    // flash on hit
    if (tg.flash > 0) {
      const m = tg.mesh.children[0].material;
      m.emissiveIntensity = 0.6 + tg.flash * 4;
    } else {
      tg.mesh.children[0].material.emissiveIntensity = 0.6;
    }
  }
  // popups (DOM)
  const popWrap = $('popups');
  const alive = new Set(popups.map(p => p._id));
  for (const el of popWrap.querySelectorAll('.pop')) {
    if (!alive.has(Number(el.dataset.id))) el.remove();
  }
  for (let pi = 0; pi < popups.length; pi++) {
    const p = popups[pi];
    if (!p._id) {
      p._id = Math.random() * 1e9;
      const el = document.createElement('div');
      el.className = 'pop';
      el.dataset.id = String(p._id);
      el.textContent = p.text;
      el.style.color = p.color || '#ffd23e';
      el.style.left = (50 + p.x / 18) + '%';
      el.style.top = (50 - p.y / 18) + '%';
      popWrap.appendChild(el);
    }
  }
  // camera shake
  if (shake > 0) {
    shake -= dt;
    camera.position.x = (Math.random() - 0.5) * shake * 30;
    camera.position.y = (Math.random() - 0.5) * shake * 30;
  } else {
    camera.position.x = 0; camera.position.y = 0;
  }
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  // HUD
  scoreEl.textContent = score;
  highEl.textContent = high;
  heatFill.style.width = heat + '%';
  if (focus) {
    timerEl.style.color = '#00d4ff';
    heatFill.style.width = '0%';
  } else {
    timerEl.style.color = '#ffd23e';
  }
}

// ---------- main loop ----------
let last = performance.now();
let paused = false;
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (!paused) {
    update(dt);
    render(dt, now / 1000);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- test hooks ----------
if (TEST) {
  window.__neon = {
    get state() { return state; },
    get score() { return score; },
    get high() { return high; },
    get heat() { return heat; },
    get combo() { return combo; },
    get timeLeft() { return timeLeft; },
    get focus() { return focus; },
    get targets() { return targets.map(t => ({ x: t.x, y: t.y, role: t.role, r: t.r })); },
    start: startGame,
    spawn: (role) => spawnTarget(role),
    fireAt: (x, y) => fire(x, y),
    fireWorld: (x, y) => hitWorld(x, y),
    setHeat: (v) => { heat = clamp(v, 0, 100); },
    focusNow: useFocus,
    step: (n) => { for (let i = 0; i < (n || 1); i++) update(1 / 60); },
    pause: () => { paused = true; },
    resume: () => { paused = false; },
  };
}

startGame();
</script>
