<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DANCEFLOOR PANIC — Autonomy Labs</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05060f;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
  #scene{position:fixed;inset:0;display:block;touch-action:none;cursor:crosshair;}
  #hud{position:fixed;top:0;left:0;right:0;padding:10px 14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5;color:#cfe8ff;text-shadow:0 0 8px rgba(0,180,255,.6);}
  .hud-block{display:flex;flex-direction:column;gap:2px;}
  .hud-label{font-size:10px;letter-spacing:2px;color:#7fb8e8;text-transform:uppercase;}
  .hud-value{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;}
  #hud .mid{display:flex;flex-direction:column;align-items:center;gap:3px;}
  #combo-display{font-size:18px;font-weight:900;color:#ffd23e;font-variant-numeric:tabular-nums;}
  #health-wrap{width:160px;height:10px;border:1px solid #00ff88;border-radius:5px;overflow:hidden;background:rgba(0,0,0,.5);}
  #health-fill{height:100%;width:100%;background:linear-gradient(90deg,#00ff88,#00d4ff);transition:width .2s;}
  #focus-wrap{width:160px;height:8px;border:1px solid #7b5cff;border-radius:4px;overflow:hidden;background:rgba(0,0,0,.5);margin-top:2px;}
  #focus-fill{height:100%;width:0%;background:linear-gradient(90deg,#7b5cff,#00d4ff);transition:width .2s;}
  #announce{position:fixed;left:50%;top:130px;transform:translateX(-50%);background:rgba(10,16,40,.92);border:1px solid #ffb300;border-radius:10px;padding:8px 20px;color:#ffd23e;font-weight:800;font-size:16px;letter-spacing:1px;z-index:5;display:none;pointer-events:none;box-shadow:0 0 16px rgba(255,176,0,.4);}
  #route-card{position:fixed;left:50%;top:56px;transform:translateX(-50%);background:rgba(10,16,40,.92);border:1px solid #00d4ff;border-radius:10px;padding:10px 22px;z-index:7;text-align:center;pointer-events:auto;}
  #route-card h3{margin:0 0 6px;color:#00d4ff;font-size:13px;letter-spacing:2px;text-transform:uppercase;}
  #route-card .opts{display:flex;gap:10px;justify-content:center;}
  #route-card button{padding:8px 18px;border-radius:20px;border:none;font-weight:800;font-size:13px;cursor:pointer;}
  #route-card .safe{background:linear-gradient(90deg,#00d4ff,#7b5cff);color:#04101a;}
  #route-card .risk{background:linear-gradient(90deg,#ffb300,#ff3d81);color:#1a0d00;}
  #popups{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden;}
  #popups .pop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;font-weight:900;text-shadow:0 0 12px rgba(0,0,0,.9);white-space:nowrap;animation:popfloat .9s ease-out forwards;}
  @keyframes popfloat{0%{opacity:0;scale:.6;}15%{opacity:1;scale:1.15;}30%{scale:1;}100%{opacity:0;scale:1.1;translate:0 -40px;}}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,6,16,.82);z-index:10;color:#e8f4ff;text-align:center;}
  #overlay h1{font-size:40px;margin:0 0 6px;letter-spacing:3px;background:linear-gradient(90deg,#00d4ff,#ff3d81,#ffb300);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;}
  #overlay h2{font-size:18px;margin:0 0 18px;color:#9fd4ff;font-weight:400;}
  #overlay .big{font-size:34px;font-weight:800;margin:6px 0;}
  #overlay .sub{font-size:14px;color:#7fb8e8;margin:2px 0;}
  #overlay .hint{margin-top:22px;font-size:13px;color:#5a7fa8;letter-spacing:1px;line-height:1.7;}
  #overlay button{margin-top:14px;padding:12px 34px;font-size:16px;font-weight:700;letter-spacing:2px;color:#04101a;background:linear-gradient(90deg,#00d4ff,#ff3d81);border:none;border-radius:30px;cursor:pointer;pointer-events:auto;}
  #overlay button:active{transform:scale(.96);}
  #mute{position:fixed;top:10px;right:14px;z-index:6;background:rgba(0,0,0,.4);border:1px solid #2a4a6a;color:#9fd4ff;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;pointer-events:auto;}
  #touch{position:fixed;bottom:0;left:0;right:0;height:36%;display:none;z-index:4;}
  #touch .zone{position:absolute;bottom:0;width:25%;height:100%;pointer-events:auto;}
  #touch .zone:nth-child(1){left:0;}
  #touch .zone:nth-child(2){left:25%;}
  #touch .zone:nth-child(3){left:50%;}
  #touch .zone:nth-child(4){left:75%;}
  #touch .zone::after{content:'';position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;border:2px solid rgba(0,212,255,.35);}
  @media (pointer:coarse){ #touch{display:block;} }
</style>
</head>
<body>
<div id="scene"></div>
<div id="hud">
  <div class="hud-block">
    <span class="hud-label">Score</span>
    <span class="hud-value" id="score">0</span>
  </div>
  <div class="mid">
    <div id="combo-display">x1</div>
    <div id="health-wrap"><div id="health-fill"></div></div>
    <div id="focus-wrap"><div id="focus-fill"></div></div>
  </div>
  <div class="hud-block" style="align-items:flex-end;">
    <span class="hud-label">High Score</span>
    <span class="hud-value" id="high">0</span>
  </div>
</div>
<div id="announce"></div>
<div id="route-card">
  <h3>Phrase Break — Choose Route</h3>
  <div class="opts">
    <button class="safe" id="route-safe">SAFE<br><small>steady +1x</small></button>
    <button class="risk" id="route-risk">RISK<br><small>×2 points, denser</small></button>
  </div>
</div>
<div id="popups"></div>
<button id="mute">SOUND ON</button>
<div id="touch"><div class="zone"></div><div class="zone"></div><div class="zone"></div><div class="zone"></div></div>
<div id="overlay">
  <h1>DANCEFLOOR PANIC</h1>
  <h2>Follow the beat. Hit the line. Survive the phrase breaks.</h2>
  <div class="big" id="final-score">0</div>
  <div class="sub" id="final-high">High score: 0</div>
  <div class="sub" id="final-new">NEW HIGH SCORE!</div>
  <div class="hint">A S K L (or ← ↓ ↑ →) — hit lanes &nbsp;·&nbsp; F — Focus (heal, when full) &nbsp;·&nbsp; R — restart</div>
  <button id="start">START</button>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ============================================================
   DANCEFLOOR PANIC — rhythm and reaction score attack
   Self-contained single file. No external assets, no build.
   ============================================================ */

const TEST = new URLSearchParams(location.search).has('test');

// ---------- lanes ----------
const LANES = 4;
const LANE_W = 150, LANE_GAP = 26;
const FIELD_W = LANES * LANE_W + (LANES - 1) * LANE_GAP;
const TIMING_Y = -380;                     // timing line world y
const PROMPT_SPEED = 340;                  // px per beat-second toward the line

// ---------- state ----------
let score = 0, high = 0, combo = 0, maxCombo = 0;
let health = 100, focusMeter = 0, focusT = 0;
let state = 'title';                       // title | play | over | route
let bpm = 112, beatDur = 60 / 112;
let songT = 0, nextNoteT = 0, patternIdx = 0;
let notes = [];                            // {lane, t (seconds until line), hold, holdT, judged}
let holdActive = null;
let route = 'safe', phrase = 1, phraseLen = 16, laneFlip = false, flipT = 0;
let parts = [], popups = [], hitFlashes = [];
let muted = false;
try { muted = localStorage.getItem('dp_mute') === '1'; } catch (e) {}
try { high = parseInt(localStorage.getItem('dp_high') || '0', 10) || 0; } catch (e) {}

// ---------- renderer ----------
const sceneEl = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.setSize(window.innerWidth, window.innerHeight);
sceneEl.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060f);
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 4000);
camera.position.set(0, 0, 1200);
camera.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0x334466, 1.3));
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(300, 600, 900);
scene.add(key);
const rim = new THREE.PointLight(0x00d4ff, 700, 2000);
rim.position.set(0, 0, 500);
scene.add(rim);

// floor
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(FIELD_W + 200, 1400),
  new THREE.MeshStandardMaterial({ color: 0x0a0f2a, roughness: 0.6, metalness: 0.3 })
);
scene.add(floor);
// lane strips (4 fixed positions)
const laneMeshes = [];
for (let i = 0; i < LANES; i++) {
  const x = (i - 1.5) * (LANE_W + LANE_GAP);
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(LANE_W, 1400),
    new THREE.MeshStandardMaterial({ color: 0x13204a, emissive: 0x13204a, emissiveIntensity: 0.4, side: THREE.DoubleSide })
  );
  m.position.x = x;
  m.position.z = 1;
  scene.add(m);
  laneMeshes.push(m);
}
// timing line
const timingLine = new THREE.Mesh(
  new THREE.PlaneGeometry(FIELD_W + 60, 10),
  new THREE.MeshStandardMaterial({ color: 0x00ff88, emissive: 0x00ff88, emissiveIntensity: 0.9, side: THREE.DoubleSide })
);
timingLine.position.y = TIMING_Y;
timingLine.position.z = 2;
scene.add(timingLine);
// lane key labels
const KEY_LABELS = ['A', 'S', 'K', 'L'];
for (let i = 0; i < LANES; i++) {
  const x = (i - 1.5) * (LANE_W + LANE_GAP);
  const cv = document.createElement('canvas');
  cv.width = 96; cv.height = 96;
  const cg = cv.getContext('2d');
  cg.font = 'bold 56px sans-serif';
  cg.textAlign = 'center'; cg.textBaseline = 'middle';
  cg.fillStyle = '#5a7fa8';
  cg.fillText(KEY_LABELS[i], 48, 54);
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, opacity: 0.8 }));
  sp.position.set(x, TIMING_Y - 90, 4);
  sp.scale.set(80, 80, 1);
  scene.add(sp);
}
// note meshes
const noteMeshes = [];
for (let i = 0; i < LANES; i++) {
  const x = (i - 1.5) * (LANE_W + LANE_GAP);
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(LANE_W - 30, 26, 10),
    new THREE.MeshStandardMaterial({ color: 0x00d4ff, emissive: 0x00d4ff, emissiveIntensity: 0.6 })
  );
  m.position.x = x;
  m.visible = false;
  scene.add(m);
  noteMeshes.push(m);
}
// hold fill mesh
const holdMesh = new THREE.Mesh(
  new THREE.BoxGeometry(LANE_W - 30, 1, 8),
  new THREE.MeshStandardMaterial({ color: 0xffb300, emissive: 0xffb300, emissiveIntensity: 0.7 })
);
holdMesh.visible = false;
scene.add(holdMesh);

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const scoreEl = $('score'), highEl = $('high'), comboEl = $('combo-display'),
  healthFill = $('health-fill'), focusFill = $('focus-fill'), overlay = $('overlay'),
  finalScore = $('final-score'), finalHigh = $('final-high'), finalNew = $('final-new'),
  startBtn = $('start'), muteBtn = $('mute'), announceEl = $('announce'),
  routeCard = $('route-card'), routeSafe = $('route-safe'), routeRisk = $('route-risk');
function setMuteUI() { muteBtn.textContent = muted ? 'SOUND OFF' : 'SOUND ON'; }
muteBtn.addEventListener('click', () => { muted = !muted; try { localStorage.setItem('dp_mute', muted ? '1' : '0'); } catch (e) {} setMuteUI(); });
setMuteUI();

// ---------- audio ----------
let AC = null;
function audio() {
  if (muted) return null;
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, slide) {
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, ac.currentTime + dur);
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur + 0.02);
}
function beat() { tone(880, 0.06, 'sine', 0.08); }
const sfx = {
  perfect: () => { tone(1320, 0.1, 'sine', 0.2); },
  good: () => tone(880, 0.1, 'sine', 0.15, 990),
  miss: () => tone(200, 0.25, 'sawtooth', 0.12, 90),
  hold: () => tone(660, 0.4, 'sine', 0.12),
  focus: () => { tone(330, 0.2, 'sine', 0.15); setTimeout(() => tone(660, 0.2, 'sine', 0.15), 100); },
  over: () => { tone(440, 0.2, 'sine', 0.15); setTimeout(() => tone(330, 0.25, 'sine', 0.15), 180); setTimeout(() => tone(220, 0.4, 'sine', 0.15), 360); },
};

// ---------- helpers ----------
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function addPopup(x, y, text, color) {
  popups.push({ x, y, text, color, t: 0, life: 0.9 });
}
function addParts(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 100 + Math.random() * 260;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.5, color });
  }
}
function scoreAdd(base, x, y, label) {
  score += base;
  addPopup(x, y, '+' + base, label || '#ffd23e');
  if (score > high) { high = score; try { localStorage.setItem('dp_high', String(high)); } catch (e) {} }
  return base;
}
function addCombo() {
  combo++;
  if (combo > maxCombo) maxCombo = combo;
  comboEl.textContent = 'x' + combo;
}
function breakCombo() {
  combo = 0;
  comboEl.textContent = 'x1';
}
function addFocus(v) {
  focusMeter = clamp(focusMeter + v, 0, 100);
}
function useFocus() {
  if (focusMeter < 100 || state !== 'play') return;
  focusMeter = 0;
  focusT = 3;  // focus window: next notes within 3s auto-perfect + heal
  health = clamp(health + 20, 0, 100);
  sfx.focus();
  addPopup(0, 200, 'FOCUS: AUTO-PERFECT + HEAL', '#7b5cff');
}

// ---------- pattern generation ----------
function nextPattern() {
  const p = patternIdx;
  patternIdx++;
  const t = songT + 2.2;  // spawn 2.2s ahead
  if (route === 'risk') {
    // risk route: denser, doubles
    const kind = p % 4;
    if (kind === 0) {
      // double tap same lane
      const lane = Math.floor(Math.random() * LANES);
      notes.push({ lane, t, hold: 0 });
      notes.push({ lane, t: t + beatDur * 0.5, hold: 0 });
    } else if (kind === 1) {
      // alternation
      const l1 = Math.floor(Math.random() * LANES);
      const l2 = (l1 + 2) % LANES;
      notes.push({ lane: l1, t, hold: 0 });
      notes.push({ lane: l2, t: t + beatDur, hold: 0 });
    } else if (kind === 2) {
      // hold
      notes.push({ lane: Math.floor(Math.random() * LANES), t, hold: beatDur * 2 });
    } else {
      // triple
      const l1 = Math.floor(Math.random() * LANES);
      notes.push({ lane: l1, t, hold: 0 });
      notes.push({ lane: (l1 + 1) % LANES, t: t + beatDur * 0.66, hold: 0 });
      notes.push({ lane: (l1 + 2) % LANES, t: t + beatDur * 1.32, hold: 0 });
    }
  } else {
    // safe route: steady single notes + occasional holds
    const kind = p % 3;
    if (kind === 0 && p % 5 === 0) {
      notes.push({ lane: Math.floor(Math.random() * LANES), t, hold: beatDur * 1.5 });
    } else {
      notes.push({ lane: Math.floor(Math.random() * LANES), t, hold: 0 });
    }
  }
  nextNoteT = t + beatDur * (route === 'risk' ? 0.75 : 1);
}

// ---------- flow ----------
function startGame() {
  score = 0; combo = 0; maxCombo = 0; health = 100; focusMeter = 0;
  songT = 0; patternIdx = 0; phrase = 1; route = 'safe';
  notes = []; holdActive = null; laneFlip = false; flipT = 0;
  focusT = 0;
  bpm = 112; beatDur = 60 / bpm;
  nextNoteT = 1;
  scoreEl.textContent = '0';
  highEl.textContent = high;
  comboEl.textContent = 'x1';
  healthFill.style.width = '100%';
  focusFill.style.width = '0%';
  overlay.style.display = 'none';
  routeCard.style.display = 'none';
  announceEl.style.display = 'none';
  state = 'play';
  announce('PHRASE 1 — SAFE ROUTE');
}
startBtn.addEventListener('click', startGame);

function announce(text) {
  announceEl.textContent = text;
  announceEl.style.display = 'block';
  setTimeout(() => { announceEl.style.display = 'none'; }, 2200);
}

function gameOver() {
  state = 'over';
  sfx.over();
  const isNew = score >= high && score > 0;
  finalScore.textContent = score;
  finalHigh.textContent = 'High score: ' + high;
  finalNew.style.display = isNew ? 'block' : 'none';
  overlay.style.display = 'flex';
}

// lane transforms: flip announced at phrase start
function transformLanes() {
  laneFlip = !laneFlip;
  flipT = 4;
  announce('LANES ' + (laneFlip ? 'REVERSED!' : 'NORMAL'));
}

// ---------- input ----------
const KEY_TO_LANE = { 'a': 0, 'A': 0, 's': 1, 'S': 1, 'k': 2, 'K': 2, 'l': 3, 'L': 3, 'ArrowLeft': 0, 'ArrowDown': 1, 'ArrowUp': 2, 'ArrowRight': 3 };
function hitLane(rawLane) {
  if (state !== 'play') return;
  const lane = laneFlip ? (LANES - 1 - rawLane) : rawLane;
  // find nearest unjudged note in this lane
  let best = null, bestD = Infinity;
  for (const n of notes) {
    if (n.judged || n.lane !== lane) continue;
    const d = Math.abs(n.t - songT);
    if (d < bestD) { best = n; bestD = d; }
  }
  if (!best) {
    // empty lane press: small health penalty
    health = Math.max(0, health - 3);
    breakCombo();
    addPopup(0, 200, 'EMPTY', '#ff3d81');
    return;
  }
  const n = best;
  const windowP = 0.09, windowG = 0.18;
  const d = n.t - songT;
  const laneX = (lane - 1.5) * (LANE_W + LANE_GAP);
  if (Math.abs(d) <= windowP) {
    n.judged = true;
    addCombo();
    const mult = route === 'risk' ? 2 : 1;
    scoreAdd(100 * mult * (1 + combo * 0.1), laneX, TIMING_Y + 40, '#00ff88');
    addFocus(12);
    addParts(laneX, TIMING_Y, 0x00ff88, 8);
    sfx.perfect();
  } else if (Math.abs(d) <= windowG) {
    n.judged = true;
    addCombo();
    const mult = route === 'risk' ? 2 : 1;
    scoreAdd(50 * mult * (1 + combo * 0.1), laneX, TIMING_Y + 40, '#ffd23e');
    addFocus(6);
    addParts(laneX, TIMING_Y, 0xffd23e, 6);
    sfx.good();
  }
}
window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const k = e.key;
  if (k === 'r' || k === 'R') { if (state === 'over' || state === 'title') startGame(); }
  if (k === 'm' || k === 'M') { muted = !muted; try { localStorage.setItem('dp_mute', muted ? '1' : '0'); } catch (e) {} setMuteUI(); }
  if (k === 'f' || k === 'F') { useFocus(); return; }
  if (state === 'title' || state === 'over') { if (k === ' ') startGame(); return; }
  if (state === 'route') return;
  if (KEY_TO_LANE[k] !== undefined) {
    hitLane(KEY_TO_LANE[k]);
    e.preventDefault();
  }
});
const touchZones = document.querySelectorAll('#touch .zone');
touchZones.forEach((z, i) => {
  z.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (state === 'title' || state === 'over') { startGame(); return; }
    if (state !== 'route') hitLane(i);
  }, { passive: false });
});
routeSafe.addEventListener('click', () => {
  if (state !== 'route') return;
  route = 'safe';
  routeCard.style.display = 'none';
  state = 'play';
  announce('SAFE ROUTE');
});
routeRisk.addEventListener('click', () => {
  if (state !== 'route') return;
  route = 'risk';
  routeCard.style.display = 'none';
  state = 'play';
  announce('RISK ROUTE — ×2!');
});

// ---------- update ----------
function update(dt) {
  if (state !== 'play') return;
  songT += dt;
  // beat tick (visual cue, audio optional)
  const beatPos = songT % beatDur;
  if (beatPos < dt) beat();
  // focus window
  if (focusT > 0) {
    focusT -= dt;
    if (focusT <= 0) addPopup(0, 200, 'FOCUS END', '#7fb8e8');
  }
  // lane flip timer
  if (laneFlip) {
    flipT -= dt;
    if (flipT <= 0) { laneFlip = false; announce('LANES NORMAL'); }
  }
  // spawn notes
  if (songT >= nextNoteT - 2) {
    nextPattern();
  }
  // judge/age notes
  for (let i = notes.length - 1; i >= 0; i--) {
    const n = notes[i];
    if (n.judged) {
      notes.splice(i, 1);
      continue;
    }
    if (n.t < songT - 0.25) {
      // missed
      n.judged = true;
      breakCombo();
      health = Math.max(0, health - 8);
      sfx.miss();
      addPopup(0, 200, 'MISS', '#ff3d81');
      if (health <= 0) { gameOver(); return; }
    }
  }
  // phrase break: every phraseLen beats, offer route choice
  const beatsDone = Math.floor(songT / beatDur);
  if (beatsDone > 0 && beatsDone % phraseLen === 0 && state === 'play') {
    state = 'route';
    phrase++;
    routeCard.style.display = 'block';
    // transform lanes every 3rd phrase
    if (phrase % 3 === 0) transformLanes();
  }
  // health regen on combo (small)
  if (combo > 0 && combo % 10 === 0) health = clamp(health + 2, 0, 100);
  // particles
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.t > p.life) { parts.splice(i, 1); i--; }
  }
  // popups
  for (let pi = 0; pi < popups.length; pi++) {
    const p = popups[pi];
    p.t += dt;
    if (p.t > p.life) { popups.splice(pi, 1); pi--; }
  }
  // HUD
  scoreEl.textContent = score;
  highEl.textContent = high;
  healthFill.style.width = health + '%';
  healthFill.style.background = health < 30 ? 'linear-gradient(90deg,#ff3d81,#ffb300)' : 'linear-gradient(90deg,#00ff88,#00d4ff)';
  focusFill.style.width = focusMeter + '%';
}

// ---------- render ----------
function render(dt, t) {
  // notes: move toward timing line
  for (let i = 0; i < LANES; i++) {
    const m = noteMeshes[i];
    let visible = false, my = 0;
    for (const n of notes) {
      if (n.judged || n.lane !== i) continue;
      const y = TIMING_Y + (n.t - songT) * PROMPT_SPEED;
      if (y < TIMING_Y + 700 && y > TIMING_Y - 100) {
        visible = true;
        my = y;
        m.position.y = y;
        // pulse near the line
        const near = clamp(1 - Math.abs(n.t - songT) / 0.25, 0, 1);
        m.scale.set(1 + near * 0.2, 1 + near * 0.2, 1);
        m.material.emissiveIntensity = 0.4 + near * 0.6;
        break;
      }
    }
    m.visible = visible;
  }
  // hold rendering: fill between note start and current
  holdMesh.visible = false;
  for (const n of notes) {
    if (n.judged || !n.hold) continue;
    const startY = TIMING_Y + (n.t - songT) * PROMPT_SPEED;
    const endY = TIMING_Y + (n.t + n.hold - songT) * PROMPT_SPEED;
    if (endY > TIMING_Y - 20) {
      holdMesh.visible = true;
      holdMesh.position.set((n.lane - 1.5) * (LANE_W + LANE_GAP), (startY + endY) / 2, 1);
      holdMesh.scale.y = Math.max(1, Math.abs(endY - startY));
    }
  }
  // popups (DOM)
  const popWrap = $('popups');
  const alive = new Set(popups.map(p => p._id));
  for (const el of popWrap.querySelectorAll('.pop')) {
    if (!alive.has(Number(el.dataset.id))) el.remove();
  }
  for (let pi = 0; pi < popups.length; pi++) {
    const p = popups[pi];
    if (!p._id) {
      p._id = Math.random() * 1e9;
      const el = document.createElement('div');
      el.className = 'pop';
      el.dataset.id = String(p._id);
      el.textContent = p.text;
      el.style.color = p.color || '#ffd23e';
      el.style.left = (50 + p.x / 18) + '%';
      el.style.top = (50 - p.y / 18) + '%';
      popWrap.appendChild(el);
    }
  }
  // lane pulse on beat
  const bp = (songT % beatDur) / beatDur;
  const pulse = Math.max(0, 1 - bp * 2);
  timingLine.material.emissiveIntensity = 0.6 + pulse * 1.2;
  for (const lm of laneMeshes) {
    lm.material.emissiveIntensity = 0.3 + pulse * 0.3;
  }
  // lane flip visual: flash lanes
  if (laneFlip) {
    for (const lm of laneMeshes) lm.material.emissiveIntensity = 0.5 + Math.sin(t * 12) * 0.3;
  }
  renderer.render(scene, camera);
}

// ---------- main loop ----------
let last = performance.now();
let paused = false;
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (!paused) {
    update(dt);
    render(dt, now / 1000);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- test hooks ----------
if (TEST) {
  window.__dance = {
    get state() { return state; },
    get score() { return score; },
    get high() { return high; },
    get combo() { return combo; },
    get health() { return health; },
    get focusMeter() { return focusMeter; },
    get songT() { return songT; },
    get route() { return route; },
    get phrase() { return phrase; },
    get laneFlip() { return laneFlip; },
    get notes() { return notes.map(n => ({ lane: n.lane, t: n.t, hold: n.hold, judged: n.judged })); },
    start: startGame,
    hit: (lane) => hitLane(lane),
    setSongT: (t) => { songT = t; },
    addNote: (lane, t, hold) => { notes.push({ lane, t, hold: hold || 0, judged: false }); },
    setFocus: (v) => { focusMeter = clamp(v, 0, 100); },
    focus: useFocus,
    choose: (r) => { route = r; routeCard.style.display = 'none'; state = 'play'; },
    step: (n) => { for (let i = 0; i < (n || 1); i++) update(1 / 60); },
    pause: () => { paused = true; },
    resume: () => { paused = false; },
  };
}

startGame();
</script>
</body>
